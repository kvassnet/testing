name: fuzz
run-name: fuzz ${{ inputs.ref }} (${{ inputs.fuzztime }} each)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'branch or full commit SHA'
        required: true
        default: cpp
      fuzztime:
        description: 'seconds per libFuzzer target (e.g. 30, 60s, 2m)'
        required: true
        default: '30'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install Clang & Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang
      - name: Build libFuzzer + ASan/UBSan targets
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKVASS_ENABLE_ASAN=ON \
            -DKVASS_ENABLE_FUZZERS=ON
          cmake --build build-fuzz --target \
            fuzz_sniff_tcp \
            fuzz_sniff_quic_udp \
            fuzz_dns_codec \
            fuzz_stack_headers \
            fuzz_protocol_codec \
            fuzz_config_and_rules \
            -j
      - name: Run all 6 libFuzzer harnesses (zero artifact uploads)
        env:
          RAW_FUZZTIME: ${{ inputs.fuzztime }}
        run: |
          case "$RAW_FUZZTIME" in
            *m) SECS=$(( ${RAW_FUZZTIME%m} * 60 )) ;;
            *s) SECS=${RAW_FUZZTIME%s} ;;
            *)  SECS=$RAW_FUZZTIME ;;
          esac
          mkdir -p /tmp/fuzz-scratch
          failed=()
          for target in \
            fuzz_sniff_tcp \
            fuzz_sniff_quic_udp \
            fuzz_dns_codec \
            fuzz_stack_headers \
            fuzz_protocol_codec \
            fuzz_config_and_rules; do
            echo "::group::$target (${SECS}s)"
            corpus_dir="/tmp/fuzz-scratch/corpus-${target}"
            mkdir -p "$corpus_dir"
            if ! "./build-fuzz/${target}" "$corpus_dir" \
              -max_total_time="$SECS" \
              -artifact_prefix="/tmp/fuzz-scratch/${target}-" \
              -print_final_stats=1; then
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          rm -rf /tmp/fuzz-scratch
          if ((${#failed[@]})); then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Clean temporary binaries
        if: always()
        run: rm -rf build-fuzz /tmp/fuzz-scratch
