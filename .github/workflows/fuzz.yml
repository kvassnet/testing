name: fuzz
run-name: fuzz ${{ inputs.ref }} (${{ inputs.fuzztime }} each)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'branch or full commit SHA'
        required: true
        default: main
      fuzztime:
        description: 'time per Fuzz target (go -fuzztime)'
        required: true
        default: 2m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -fuzz (every Fuzz target, one at a time)
        env:
          FUZZTIME: ${{ inputs.fuzztime }}
        run: |
          # go test -fuzz accepts one target per package per run, so list
          # every "func FuzzXxx(" and run them serially (each run already
          # uses all CPUs). Keep going after a crash so one bad target does
          # not hide the others; fail the job at the end.
          failed=()
          while IFS=: read -r file name; do
            pkg="./$(dirname "$file")"
            echo "::group::$pkg $name"
            if ! go test -run '^$' -fuzz "^${name}\$" -fuzztime "$FUZZTIME" "$pkg"; then
              failed+=("$pkg $name")
            fi
            echo "::endgroup::"
          done < <(grep -rHo --include='*_test.go' '^func Fuzz[A-Za-z0-9_]*' . \
                     | sed 's|^\./||; s/func //' | sort -u)
          if ((${#failed[@]})); then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Collect new crashers
        if: failure()
        run: |
          # New crash inputs are written to <pkg>/testdata/fuzz/FuzzXxx/ and
          # are untracked; committed seeds are left out.
          mkdir -p /tmp/fuzz-crashers
          git ls-files --others --exclude-standard -- '*testdata/fuzz/*' \
            | xargs -r cp --parents -t /tmp/fuzz-crashers
          find /tmp/fuzz-crashers -type f
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashers
          path: /tmp/fuzz-crashers
          retention-days: 7
