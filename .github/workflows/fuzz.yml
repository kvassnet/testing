name: fuzz
run-name: fuzz ${{ inputs.ref }} (${{ inputs.fuzztime }} each, targets=${{ inputs.targets }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'branch or full commit SHA'
        required: true
        default: cpp
      fuzztime:
        description: 'seconds per libFuzzer target (e.g. 30, 60s, 2m)'
        required: true
        default: '30'
      targets:
        description: 'regex filter for libFuzzer targets'
        type: string
        required: false
        default: '.*'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install Clang & Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang
      - name: Build libFuzzer + ASan/UBSan targets
        env:
          TARGETS_REGEX: ${{ inputs.targets }}
        run: |
          CC=clang CXX=clang++ cmake --preset ci-fuzz
          mapfile -t all_targets < <(
            ninja -C build-fuzz -t targets all \
              | awk -F: '/^fuzz_[a-zA-Z0-9_]+:/ {print $1}' \
              | sort -u
          )
          regex="${TARGETS_REGEX:-.*}"
          selected=()
          for t in "${all_targets[@]}"; do
            if printf '%s\n' "$t" | grep -Eq -- "$regex"; then
              selected+=("$t")
            fi
          done
          if ((${#selected[@]} == 0)); then
            echo "ERROR: no fuzz_* targets matched regex '$regex' (available: ${all_targets[*]})" >&2
            exit 1
          fi
          printf '%s\n' "${selected[@]}" > build-fuzz/selected_targets.txt
          echo "Selected fuzz targets (${#selected[@]}): ${selected[*]}"
          cmake --build build-fuzz --target "${selected[@]}" -j
      - name: Run selected libFuzzer harnesses (zero artifact uploads)
        env:
          RAW_FUZZTIME: ${{ inputs.fuzztime }}
        run: |
          case "$RAW_FUZZTIME" in
            *m) SECS=$(( ${RAW_FUZZTIME%m} * 60 )) ;;
            *s) SECS=${RAW_FUZZTIME%s} ;;
            *)  SECS=$RAW_FUZZTIME ;;
          esac
          mapfile -t selected < build-fuzz/selected_targets.txt
          mkdir -p /tmp/fuzz-scratch
          failed=()
          for target in "${selected[@]}"; do
            echo "::group::$target (${SECS}s)"
            corpus_dir="/tmp/fuzz-scratch/corpus-${target}"
            mkdir -p "$corpus_dir"
            if ! "./build-fuzz/${target}" "$corpus_dir" \
              -max_total_time="$SECS" \
              -artifact_prefix="/tmp/fuzz-scratch/${target}-" \
              -print_final_stats=1; then
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          rm -rf /tmp/fuzz-scratch
          if ((${#failed[@]})); then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Clean temporary binaries
        if: always()
        run: rm -rf build-fuzz /tmp/fuzz-scratch
