name: test
run-name: test ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'branch or commit'
        required: true
        default: cpp
      asan:
        description: 'run Linux ASan + UBSan suite'
        type: boolean
        default: true
      linux_e2e:
        description: 'run privileged Linux netns TUN e2e'
        type: boolean
        default: false
      macos_e2e:
        description: 'run privileged macOS utun e2e'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install clang-format & clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang clang-tidy python3-pip
          python3 -m pip install --break-system-packages --quiet clang-format==21.1.7
          clang-format --version
          clang-tidy --version
      - name: Verify clang-format (Google style, 100 columns)
        run: |
          find include src apps tests -type f \( -name '*.hpp' -o -name '*.h' -o -name '*.cpp' -o -name '*.cc' -o -name '*.c' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
      - name: Run clang-tidy
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-lint -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          find src apps tests -type f -name '*.cpp' -not -name 'libfuzzer_driver.cpp' -print0 \
            | xargs -0 -n 4 -P "$(nproc)" clang-tidy --quiet -p build-lint
      - name: Clean lint build directory
        if: always()
        run: rm -rf build-lint

  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify arm64 host & Ninja
        run: |
          test "$(uname -m)" = "arm64"
          command -v ninja >/dev/null 2>&1 || brew install ninja
      - name: Configure & build (RelWithDebInfo)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j -- -k 0
      - name: Unit & architecture tests (ctest)
        run: ctest --test-dir build --output-on-failure -j4
      - name: Loopback E2E smoke test
        run: bash tests/e2e/smoke_posix.sh build
      - name: Verify release packaging script (no upload)
        run: |
          KVASS_TARGETS="darwin/arm64" sh scripts/build.sh ci-verify
          rm -rf dist build-release-darwin-arm64
      - name: Privileged macOS utun E2E
        if: inputs.macos_e2e
        run: |
          cp build/kvass-core build/gen-mmdb build/wsdump /tmp/
          sudo bash tests/e2e/macos.sh
      - name: Clean temporary binaries
        if: always()
        run: rm -rf build dist build-release-* /tmp/kvass-core /tmp/gen-mmdb /tmp/wsdump /tmp/kvass-diag

  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install build tools
        run: |
          test "$(uname -m)" = "x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang
      - name: Configure & build (RelWithDebInfo, GCC)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j -- -k 0
      - name: Unit & architecture tests (non-root)
        run: ctest --test-dir build --output-on-failure -j4
      - name: Root socket/TUN unit subset
        env:
          KVASS_TEST_ICMP_TARGET: "127.0.0.1"
          KVASS_TEST_ICMP6_TARGET: skip
        run: |
          sudo env "PATH=$PATH" \
            KVASS_TEST_ICMP_TARGET="$KVASS_TEST_ICMP_TARGET" \
            KVASS_TEST_ICMP6_TARGET="$KVASS_TEST_ICMP6_TARGET" \
            ctest --test-dir build --output-on-failure -R "kvass_milestone1_test|kvass_stack_tun_test|kvass_outbound_test"
      - name: Loopback E2E smoke test
        run: bash tests/e2e/smoke_posix.sh build
      - name: Verify release packaging script (no upload)
        run: |
          KVASS_TARGETS="linux/amd64" sh scripts/build.sh ci-verify
          rm -rf dist build-release-linux-amd64
      - name: Privileged Linux netns E2E
        if: inputs.linux_e2e
        run: |
          cp build/kvass-core build/gen-mmdb build/wsdump /tmp/
          sudo env "PATH=$PATH" bash tests/e2e/linux.sh
      - name: Clean temporary binaries
        if: always()
        run: |
          rm -rf build dist build-release-* /tmp/kvass-core /tmp/gen-mmdb /tmp/wsdump
          sudo rm -rf /tmp/kvass-diag

  linux-amd64-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install build tools
        run: |
          test "$(uname -m)" = "x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang
      - name: Configure & build (Clang Debug ASan + UBSan)
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKVASS_ENABLE_ASAN=ON
          cmake --build build-asan -j -- -k 0
      - name: Unit & architecture tests (ASan + UBSan)
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ctest --test-dir build-asan --output-on-failure -j4
      - name: Loopback E2E smoke test (ASan + UBSan)
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: bash tests/e2e/smoke_posix.sh build-asan
      - name: Clean temporary binaries
        if: always()
        run: rm -rf build-asan

  linux-amd64-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install build tools & configure ASLR for TSan
        run: |
          test "$(uname -m)" = "x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Configure & build (Clang RelWithDebInfo TSan)
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKVASS_ENABLE_TSAN=ON
          cmake --build build-tsan -j -- -k 0
      - name: Unit & architecture tests (TSan)
        env:
          KVASS_TEST_IO_THREADS: "4"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: ctest --test-dir build-tsan --output-on-failure -j4
      - name: Loopback E2E smoke test (TSan)
        env:
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: bash tests/e2e/smoke_posix.sh build-tsan
      - name: Privileged Linux netns E2E (TSan)
        if: inputs.linux_e2e
        env:
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: |
          cp build-tsan/kvass-core build-tsan/gen-mmdb build-tsan/wsdump /tmp/
          sudo env "PATH=$PATH" TSAN_OPTIONS="$TSAN_OPTIONS" bash tests/e2e/linux.sh
      - name: Clean temporary binaries
        if: always()
        run: |
          rm -rf build-tsan /tmp/kvass-core /tmp/gen-mmdb /tmp/wsdump
          sudo rm -rf /tmp/kvass-diag

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install build tools
        run: |
          test "$(uname -m)" = "aarch64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
      - name: Configure & build (RelWithDebInfo)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j -- -k 0
      - name: Unit & architecture tests (non-root)
        run: ctest --test-dir build --output-on-failure -j4
      - name: Root socket/TUN unit subset
        env:
          KVASS_TEST_ICMP_TARGET: "127.0.0.1"
          KVASS_TEST_ICMP6_TARGET: skip
        run: |
          sudo env "PATH=$PATH" \
            KVASS_TEST_ICMP_TARGET="$KVASS_TEST_ICMP_TARGET" \
            KVASS_TEST_ICMP6_TARGET="$KVASS_TEST_ICMP6_TARGET" \
            ctest --test-dir build --output-on-failure -R "kvass_milestone1_test|kvass_stack_tun_test|kvass_outbound_test"
      - name: Loopback E2E smoke test
        run: bash tests/e2e/smoke_posix.sh build
      - name: Verify release packaging script (no upload)
        run: |
          KVASS_TARGETS="linux/arm64" sh scripts/build.sh ci-verify
          rm -rf dist build-release-linux-arm64
      - name: Clean temporary binaries
        if: always()
        run: rm -rf build dist build-release-*

  windows-amd64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kvassnet/kvass-core
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.KVASS_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Configure & build (MSVC x64 RelWithDebInfo, Ninja)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j -- -k 0
      - name: Unit & architecture tests (ctest)
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -j4
      - name: Windows Loopback E2E smoke test
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/e2e/windows.ps1 -BuildDir build
      - name: Clean temporary binaries
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue }
